services:
  db:
    image: mysql:8.0
    container_name: estudiantes-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Estudiantes
      MYSQL_USER: estudiantes
      MYSQL_PASSWORD: admin
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: estudiantes-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/Estudiantes
      SPRING_DATASOURCE_USERNAME: estudiantes
      SPRING_DATASOURCE_PASSWORD: admin
    stdin_open: true
    tty: true

volumes:
  db_data:
